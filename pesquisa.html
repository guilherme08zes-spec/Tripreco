<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisar | TriPreço</title>

  <style>
    :root {
      --vinho: #641D32;
      --vinho-escuro: #481324;
      --vinho-claro: #F5EDF0;
      --preto: #191719;
      --branco: #FFFFFF;
      --fundo: #F8F7F7;
      --borda: #EAE5E7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--fundo);
      color: var(--preto);
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--branco);
      border-bottom: 1px solid var(--borda);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .voltar {
      color: var(--vinho);
      text-decoration: none;
      font-size: 25px;
      font-weight: bold;
    }

    .logo {
      color: var(--vinho);
      font-weight: 900;
      font-size: 21px;
      letter-spacing: 1px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px 16px;
    }

    h1 {
      font-size: 24px;
      margin: 8px 0 16px;
    }

    .campo-pesquisa {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 0 14px;
    }

    .campo-pesquisa span {
      font-size: 20px;
    }

    #pesquisa {
      width: 100%;
      border: none;
      outline: none;
      padding: 16px 0;
      font-size: 16px;
      background: transparent;
    }

    h2 {
      font-size: 17px;
      margin: 24px 0 12px;
    }

    #categorias {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 2px 0 12px;
    }

    .categoria {
      flex-shrink: 0;
      border: 1px solid var(--borda);
      border-radius: 22px;
      padding: 10px 15px;
      background: white;
      color: var(--preto);
      cursor: pointer;
      font-size: 14px;
    }

    .categoria.ativa {
      background: var(--vinho);
      color: white;
      border-color: var(--vinho);
    }

    #estado {
      color: #686168;
      font-size: 14px;
      margin: 12px 0;
    }

    #produtos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .produto {
      background: white;
      border: 1px solid var(--borda);
      border-radius: 12px;
      overflow: hidden;
      min-width: 0;
    }

    .produto img {
      display: block;
      width: 100%;
      height: 160px;
      object-fit: contain;
      background: white;
    }

    .produto-info {
      padding: 12px;
    }

    .produto h3 {
      font-size: 15px;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }

    .descricao {
      font-size: 13px;
      color: #6c656a;
      margin: 0 0 10px;
      overflow-wrap: anywhere;
    }

    .preco {
      color: var(--vinho);
      font-size: 18px;
      font-weight: bold;
      margin: 0;
    }

    .vazio {
      grid-column: 1 / -1;
      background: white;
      padding: 24px 16px;
      text-align: center;
      border: 1px solid var(--borda);
      border-radius: 12px;
    }

    @media (min-width: 650px) {
      #produtos {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .produto img {
        height: 210px;
      }
    }

    @media (min-width: 900px) {
      #produtos {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="voltar" href="index.html" aria-label="Voltar para a loja">‹</a>
    <div class="logo">TRIPREÇO</div>
  </header>

  <main>
    <h1>Pesquisar produtos</h1>

    <div class="campo-pesquisa">
      <span>⌕</span>
      <input
        id="pesquisa"
        type="search"
        placeholder="O que você está procurando?"
        autocomplete="off"
      >
    </div>

    <h2>Explorar categorias</h2>
    <div id="categorias">
      <button class="categoria ativa" data-categoria="Todas">Todas</button>
      <button class="categoria" data-categoria="Eletrônicos">Eletrônicos</button>
      <button class="categoria" data-categoria="Roupas">Roupas</button>
      <button class="categoria" data-categoria="Casa e Cozinha">Casa e Cozinha</button>
      <button class="categoria" data-categoria="Beleza">Beleza</button>
      <button class="categoria" data-categoria="Acessórios">Acessórios</button>
      <button class="categoria" data-categoria="Utilidades">Utilidades</button>
    </div>

    <p id="estado">Carregando produtos...</p>
    <section id="produtos" aria-live="polite"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://dowcydjnopmksxiixefm.supabase.co";

    // COPIE A CHAVE anon PÚBLICA DO index.html E COLE ENTRE AS ASPAS:
    const SUPABASE_ANON_KEY = "sb_publishable_mOrQ1lFrjWyd8Wh5aC_b3A_NACR2JRD";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const campoPesquisa = document.getElementById("pesquisa");
    const listaProdutos = document.getElementById("produtos");
    const estado = document.getElementById("estado");
    const botoesCategoria = document.querySelectorAll(".categoria");

    let produtos = [];
    let categoriaSelecionada = "Todas";

    function normalizar(texto) {
      return (texto || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function escaparHTML(texto) {
      return (texto ?? "").toString().replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[caractere]);
    }

    function mostrarProdutos() {
      const termo = normalizar(campoPesquisa.value);

      const filtrados = produtos.filter(produto => {
        const texto = normalizar(
          `${produto.nome || ""} ${produto.descricao || ""}`
        );

        const combinaPesquisa = texto.includes(termo);
        const combinaCategoria =
          categoriaSelecionada === "Todas" ||
          normalizar(produto.categoria) === normalizar(categoriaSelecionada);

        return combinaPesquisa && combinaCategoria;
      });

      estado.textContent = `${filtrados.length} produto(s) encontrado(s).`;

      if (!filtrados.length) {
        listaProdutos.innerHTML =
          '<div class="vazio">Nenhum produto encontrado. Tente outra pesquisa ou categoria.</div>';
        return;
      }

      listaProdutos.innerHTML = filtrados.map(produto => {
        const nome = escaparHTML(produto.nome || "Produto");
        const descricao = escaparHTML(produto.descricao || "");
        const imagem = produto.imagem_url || "";
        const preco = Number(produto.preco);

        const imagemHTML = imagem
          ? `<img src="${escaparHTML(imagem)}" alt="${nome}" loading="lazy">`
          : "";

        return `
          <article class="produto">
            ${imagemHTML}
            <div class="produto-info">
              <h3>${nome}</h3>
              <p class="descricao">${descricao}</p>
              <p class="preco">${
                Number.isFinite(preco)
                  ? preco.toLocaleString("pt-BR", {
                      style: "currency",
                      currency: "BRL"
                    })
                  : "Consulte o preço"
              }</p>
            </div>
          </article>
        `;
      }).join("");
    }

    botoesCategoria.forEach(botao => {
      botao.addEventListener("click", () => {
        categoriaSelecionada = botao.dataset.categoria;

        botoesCategoria.forEach(outro => {
          outro.classList.toggle("ativa", outro === botao);
        });

        mostrarProdutos();
      });
    });

    campoPesquisa.addEventListener("input", mostrarProdutos);

    async function carregarProdutos() {
      estado.textContent = "Carregando produtos...";

      const { data, error } = await supabaseClient
        .from("produtos")
        .select("id,nome,descricao,categoria,preco,imagem_url,ativo")
        .eq("ativo", true)
        .order("criado_em", { ascending: false });

      if (error) {
        console.error("Erro ao carregar produtos:", error);
        estado.textContent =
          "Não foi possível carregar os produtos. Tente atualizar a página.";
        listaProdutos.innerHTML = "";
        return;
      }

      produtos = data || [];
      mostrarProdutos();
    }

    carregarProdutos();
  </script>
</body>
</html>
