<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisar | TriPreço</title>

  <style>

:root {
  --vinho: #641D32;
  --vinho-escuro: #481324;
  --vinho-claro: #F5EDF0;
  --preto: #191719;
  --branco: #FFFFFF;
  --fundo: #F8F6F7;
  --borda: #EBE4E7;
  --texto-suave: #777078;
  --sombra: 0 8px 24px rgba(48, 20, 32, 0.06);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--fundo);
  color: var(--preto);
  -webkit-font-smoothing: antialiased;
}

header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 17px 20px;
  background: rgba(255, 255, 255, 0.97);
  border-bottom: 1px solid var(--borda);
  position: sticky;
  top: 0;
  z-index: 10;
}

.voltar {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: var(--vinho-claro);
  color: var(--vinho);
  text-decoration: none;
  font-size: 27px;
  font-weight: bold;
  transition: background 0.2s, transform 0.2s;
}

.voltar:active {
  transform: scale(0.96);
}

.logo {
  color: var(--vinho);
  font-weight: 900;
  font-size: 21px;
  letter-spacing: 1.4px;
}

main {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 30px 20px 48px;
}

h1 {
  font-size: clamp(25px, 5vw, 34px);
  line-height: 1.2;
  letter-spacing: -0.8px;
  margin: 4px 0 24px;
}

.campo-pesquisa {
  display: flex;
  align-items: center;
  gap: 13px;
  background: var(--branco);
  border: 1px solid var(--borda);
  border-radius: 17px;
  padding: 0 17px;
  box-shadow: var(--sombra);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.campo-pesquisa:focus-within {
  border-color: var(--vinho);
  box-shadow: 0 0 0 3px rgba(100, 29, 50, 0.08);
}

.campo-pesquisa span {
  color: var(--vinho);
  font-size: 25px;
}

#pesquisa {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  padding: 18px 0;
  font-size: 15px;
  color: var(--preto);
  background: transparent;
}

#pesquisa::placeholder {
  color: #9A9297;
}

h2 {
  font-size: 18px;
  letter-spacing: -0.3px;
  margin: 30px 0 15px;
}

#categorias {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 3px 2px 13px;
  scrollbar-width: thin;
  scrollbar-color: #D8C6CD transparent;
  -webkit-overflow-scrolling: touch;
}

.categoria {
  flex-shrink: 0;
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 12px 16px;
  background: var(--branco);
  color: #51484D;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: color 0.2s, background 0.2s, border-color 0.2s;
}

.categoria.ativa {
  background: var(--vinho);
  color: var(--branco);
  border-color: var(--vinho);
  box-shadow: 0 4px 12px rgba(100, 29, 50, 0.16);
}

#estado {
  color: var(--texto-suave);
  font-size: 13px;
  margin: 15px 0 17px;
}

#produtos {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  align-items: stretch;
}

.produto {
  min-width: 0;
  overflow: hidden;
  background: var(--branco);
  border: 1px solid var(--borda);
  border-radius: 17px;
  box-shadow: 0 3px 12px rgba(48, 20, 32, 0.035);
  transition: box-shadow 0.2s, transform 0.2s;
}

.produto img {
  display: block;
  width: 100%;
  height: 155px;
  object-fit: contain;
  padding: 12px;
  background: #FFFFFF;
  border-bottom: 1px solid #F2EDF0;
}

.produto-info {
  padding: 13px 12px 15px;
}

.produto h3 {
  font-size: 14px;
  line-height: 1.45;
  font-weight: 700;
  margin: 0 0 8px;
  overflow-wrap: anywhere;
}

.descricao {
  font-size: 12px;
  line-height: 1.5;
  color: var(--texto-suave);
  margin: 0 0 13px;
  overflow-wrap: anywhere;
}

.preco {
  color: var(--vinho);
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.3px;
  margin: 0;
}

.vazio {
  grid-column: 1 / -1;
  background: var(--branco);
  padding: 30px 20px;
  text-align: center;
  line-height: 1.6;
  color: var(--texto-suave);
  border: 1px solid var(--borda);
  border-radius: 17px;
}

@media (min-width: 600px) {
  main {
    padding: 38px 28px 56px;
  }

  #produtos {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .produto img {
    height: 200px;
  }

  .produto-info {
    padding: 16px;
  }

  .produto h3 {
    font-size: 15px;
  }

  .preco {
    font-size: 19px;
  }
}

@media (min-width: 900px) {
  #produtos {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
  }

  .produto img {
    height: 220px;
  }

  .produto:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(48, 20, 32, 0.09);
  }

  .categoria:hover {
    border-color: var(--vinho);
    color: var(--vinho);
  }

  .categoria.ativa:hover {
    color: var(--branco);
  }
}

@media (max-width: 360px) {
  header {
    padding: 13px;
  }

  main {
    padding: 23px 12px 35px;
  }

  #produtos {
    gap: 9px;
  }

  .produto img {
    height: 130px;
    padding: 8px;
  }

  .produto-info {
    padding: 10px;
  }

  .produto h3 {
    font-size: 13px;
  }

  .preco {
    font-size: 15px;
  }
}
    .btn-adicionar {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 12px 10px;
  border: none;
  border-radius: 10px;
  background: var(--vinho);
  color: var(--branco);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.btn-adicionar:active {
  background: var(--vinho-escuro);
  transform: scale(0.98);
}

  </style>
</head>

<body>
  <header>
    <a class="voltar" href="index.html" aria-label="Voltar para a loja">‹</a>
    <div class="logo">TRIPREÇO</div>
  </header>

  <main>
    <h1>Pesquisar produtos</h1>

    <div class="campo-pesquisa">
      <span>⌕</span>
      <input
        id="pesquisa"
        type="search"
        placeholder="O que você está procurando?"
        autocomplete="off"
      >
    </div>

    <h2>Explorar categorias</h2>
    <div id="categorias">
      <button class="categoria ativa" data-categoria="Todas">Todas</button>
      <button class="categoria" data-categoria="Eletrônicos">Eletrônicos</button>
      <button class="categoria" data-categoria="Roupas">Roupas</button>
      <button class="categoria" data-categoria="Casa e Cozinha">Casa e Cozinha</button>
      <button class="categoria" data-categoria="Beleza">Beleza</button>
      <button class="categoria" data-categoria="Acessórios">Acessórios</button>
      <button class="categoria" data-categoria="Utilidades">Utilidades</button>
    </div>

    <p id="estado">Carregando produtos...</p>
    <section id="produtos" aria-live="polite"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://dowcydjnopmksxiixefm.supabase.co";

    // COPIE A CHAVE anon PÚBLICA DO index.html E COLE ENTRE AS ASPAS:
    const SUPABASE_ANON_KEY = "sb_publishable_mOrQ1lFrjWyd8Wh5aC_b3A_NACR2JRD";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const campoPesquisa = document.getElementById("pesquisa");
    const listaProdutos = document.getElementById("produtos");
    const estado = document.getElementById("estado");
    const botoesCategoria = document.querySelectorAll(".categoria");

    let produtos = [];
    let categoriaSelecionada = "Todas";

    function normalizar(texto) {
      return (texto || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function escaparHTML(texto) {
      return (texto ?? "").toString().replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[caractere]);
    }

    function mostrarProdutos() {
      const termo = normalizar(campoPesquisa.value);

      const filtrados = produtos.filter(produto => {
        const texto = normalizar(
          `${produto.nome || ""} ${produto.descricao || ""}`
        );

        const combinaPesquisa = texto.includes(termo);
        const combinaCategoria =
          categoriaSelecionada === "Todas" ||
          normalizar(produto.categoria) === normalizar(categoriaSelecionada);

        return combinaPesquisa && combinaCategoria;
      });

      estado.textContent = `${filtrados.length} produto(s) encontrado(s).`;

      if (!filtrados.length) {
        listaProdutos.innerHTML =
          '<div class="vazio">Nenhum produto encontrado. Tente outra pesquisa ou categoria.</div>';
        return;
      }

      listaProdutos.innerHTML = filtrados.map(produto => {
        const nome = escaparHTML(produto.nome || "Produto");
        const descricao = escaparHTML(produto.descricao || "");
        const imagem = produto.imagem_url || "";
        const preco = Number(produto.preco);

        const imagemHTML = imagem
          ? `<img src="${escaparHTML(imagem)}" alt="${nome}" loading="lazy">`
          : "";

        return `
  <article class="produto">
    ${imagemHTML}
    <div class="produto-info">
      <h3>${nome}</h3>
      <p class="descricao">${descricao}</p>
      <p class="preco">${
        Number.isFinite(preco)
          ? preco.toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL"
            })
          : "Consulte o preço"
      }</p>
      <button
        type="button"
        class="btn-adicionar"
        data-id="${escaparHTML(produto.id)}"
      >
        ADICIONAR AO CARRINHO
      </button>
    </div>
  </article>
`;
}).join("");
    }

    botoesCategoria.forEach(botao => {
      botao.addEventListener("click", () => {
        categoriaSelecionada = botao.dataset.categoria;

        botoesCategoria.forEach(outro => {
          outro.classList.toggle("ativa", outro === botao);
        });

        mostrarProdutos();
      });
    });

    campoPesquisa.addEventListener("input", mostrarProdutos);
        listaProdutos.addEventListener("click", evento => {
      const botao = evento.target.closest(".btn-adicionar");
      if (!botao) return;

      const id = botao.dataset.id;
      const produto = produtos.find(p => String(p.id) === String(id));

      if (!produto) return;

      let carrinho = [];

      try {
        carrinho = JSON.parse(
          localStorage.getItem("tripreco_carrinho") || "[]"
        );

        if (!Array.isArray(carrinho)) carrinho = [];
      } catch {
        carrinho = [];
      }

      const item = carrinho.find(p => String(p.id) === String(id));

      if (item) {
        item.quantidade = (Number(item.quantidade) || 0) + 1;
      } else {
        carrinho.push({
          id: produto.id,
          nome: produto.nome,
          preco: produto.preco,
          quantidade: 1
        });
      }

      localStorage.setItem("tripreco_carrinho", JSON.stringify(carrinho));

      botao.textContent = "ADICIONADO!";
      setTimeout(() => {
        botao.textContent = "ADICIONAR AO CARRINHO";
      }, 1200);
    });

    async function carregarProdutos() {
      estado.textContent = "Carregando produtos...";

      const { data, error } = await supabaseClient
        .from("produtos")
        .select("id,nome,descricao,categoria,preco,imagem_url,ativo")
        .eq("ativo", true)
        .order("criado_em", { ascending: false });

      if (error) {
        console.error("Erro ao carregar produtos:", error);
        estado.textContent =
          "Não foi possível carregar os produtos. Tente atualizar a página.";
        listaProdutos.innerHTML = "";
        return;
      }

      produtos = data || [];
      mostrarProdutos();
    }

    carregarProdutos();
  </script>
</body>
</html>
